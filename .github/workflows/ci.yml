name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: 格式检查
        run: cargo fmt --manifest-path zam/Cargo.toml -- --check
      - name: 集成回归
        run: cargo test --manifest-path zam/Cargo.toml --locked
      - name: 严格 lint
        run: cargo clippy --manifest-path zam/Cargo.toml --all-targets --locked -- -D warnings

  editor-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 编辑器语法配置检查
        run: node editors/vscode/scripts/check-grammar.mjs

  ai-workflow:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建编译器
        run: cargo build --manifest-path zam/Cargo.toml --locked
      - name: 离线 AI 修复评测
        run: pwsh -File bench/ai/run.ps1 -ZamPath zam/target/debug/zam.exe -LatencyRepeats 3
      - name: 实时 AI 对比实验的参考解
        run: python bench/ai/live/run.py --verify-solutions --zam zam/target/debug/zam.exe
      - name: 检查 AI 评测门槛
        shell: pwsh
        run: |
          $report = Get-ChildItem results/ai-bench-*/report.json | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($null -eq $report) { throw 'AI benchmark report not found' }
          $data = Get-Content $report.FullName -Raw | ConvertFrom-Json
          if ($data.validation_rate -lt 1) { throw "AI benchmark validation rate is $($data.validation_rate)" }
          if ($data.location_checked_count -lt 1 -or $data.location_match_rate -lt 1) { throw 'AI benchmark location coverage is incomplete' }
          if ($data.code_match_rate -lt 1) { throw "AI benchmark code match rate is $($data.code_match_rate)" }
      - name: 构建与体积测量
        run: pwsh -File tools/measure-build.ps1 -ZamPath zam/target/debug/zam.exe -Modules 4 -Repetitions 1
