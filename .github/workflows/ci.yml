name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: 集成回归
        run: cargo test --manifest-path zam/Cargo.toml --locked
      - name: 严格 lint
        run: cargo clippy --manifest-path zam/Cargo.toml --all-targets --locked -- -D warnings
